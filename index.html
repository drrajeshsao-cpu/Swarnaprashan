<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5f4327">
<title>Mahamaya Clinic • Swarnaprashan Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark">स्व</div>
      <div><strong>Mahamaya Clinic</strong><span>Swarnaprashan Pro</span></div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">⌂ Dashboard</button>
      <button data-view="clinical">✚ Clinical Workspace</button>
      <button data-view="children">👶 Children</button>
      <button data-view="followup">↻ Monthly Follow-up</button>
      <button data-view="analytics">◫ Growth & Analytics</button>
      <button data-view="vaccination">✓ Vaccination & Schedule</button>
      <button data-view="documents">▣ Documents & Camera</button>
      <button data-view="reports">▤ Reports & Prescription</button>
      <button data-view="education">♡ Diet • Pathya • Lifestyle</button>
      <button data-view="backup">⤓ Backup / Restore</button>
      <button data-view="settings">⚙ Settings</button>
    </nav>
    <div class="side-note">Clinical records are stored locally in this browser. Keep regular backups.</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Premium longitudinal Swarnaprashan clinical tracking</p>
      </div>
      <div class="top-actions">
        <input id="globalSearch" placeholder="Search child / mobile / ID">
        <button id="topNewChild">+ New Child</button>
        <button id="topNewCase">+ Clinical Entry</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<template id="dashboardTpl">
  <div class="hero">
    <div>
      <span class="eyebrow">SWARNAPRASHAN • GROWTH • DEVELOPMENT • DOCUMENTATION</span>
      <h2>One complete digital Swarnaprashan record for every child.</h2>
      <p>Registration → Examination → Investigations → Treatment → Prescription → Print/PDF/WhatsApp, with month-by-month growth and outcome analysis.</p>
      <div class="hero-actions">
        <button onclick="app.startClinical()">Start Clinical Workspace</button>
        <button class="ghost" onclick="app.openQuickUpload()">Quick Manual Card / Camera Upload</button>
      </div>
    </div>
    <div class="hero-mini">
      <div><b>6-step</b><span>Save & Next clinical flow</span></div>
      <div><b>Camera</b><span>baby photo + reports + manual card</span></div>
      <div><b>PDF</b><span>print-ready parent report</span></div>
    </div>
  </div>
  <div id="kpis" class="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="cardhead"><h3>Recent Children</h3><button class="linkbtn" onclick="app.showView('children')">View all</button></div><div id="recentChildren"></div></div>
    <div class="card"><div class="cardhead"><h3>Upcoming / Due Follow-up</h3><button class="linkbtn" onclick="app.showView('followup')">Record visit</button></div><div id="dueChildren"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="cardhead"><h3>Improvement Snapshot</h3><select id="dashChild"></select></div><div id="dashSnapshot"></div></div>
    <div class="card"><div class="cardhead"><h3>Recent Documents</h3><button class="linkbtn" onclick="app.showView('documents')">Open documents</button></div><div id="dashDocs"></div></div>
  </div>
</template>

<template id="clinicalTpl">
  <div class="wizard-card">
    <div class="wizard-title">
      <div><span class="eyebrow">GUIDED CLINICAL WORKFLOW</span><h2 id="wizardTitle">Swarnaprashan Clinical Entry</h2></div>
      <span class="status-badge" id="draftStatus">Draft auto-save ready</span>
    </div>
    <div id="wizardSteps" class="steps"></div>
  </div>
  <div id="wizardBody"></div>
  <div class="sticky-actions">
    <button class="ghost" id="saveDraftBtn">Save Draft</button>
    <div class="spacer"></div>
    <button class="ghost" id="prevStepBtn">← Previous</button>
    <button id="saveNextBtn">Save & Next →</button>
  </div>
</template>

<template id="childrenTpl">
  <div class="card">
    <div class="cardhead">
      <div><h3>Children Registry</h3><p class="muted">Baby photo, profile, history, mobile and quick clinical access.</p></div>
      <button id="registerChildBtn">+ Register Child</button>
    </div>
    <input id="childSearch" placeholder="Search name / mobile / registration ID">
    <div id="childrenList" class="tablewrap"></div>
  </div>
  <div id="childEditor"></div>
</template>

<template id="followupTpl">
  <div class="card">
    <div class="cardhead"><div><h3>Monthly Swarnaprashan Follow-up</h3><p class="muted">Dose, growth, vitals, health, cognition, activity and Ayurveda parameters.</p></div><span class="pill">Longitudinal</span></div>
    <div id="followupForm"></div>
  </div>
  <div class="card">
    <div class="cardhead"><h3>Visit Timeline</h3><select id="followupChild"></select></div>
    <div id="followupTimeline"></div>
  </div>
</template>

<template id="analyticsTpl">
  <div class="card">
    <div class="cardhead"><div><h3>Growth & Functional Analytics</h3><p class="muted">Automatic line, column and pie analysis from saved follow-ups.</p></div><select id="analyticsChild"></select></div>
    <div id="analyticSummary" class="metricrow"></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Line Trend</h3><canvas id="lineChart" width="900" height="360"></canvas></div>
    <div class="card"><h3>Column Comparison</h3><canvas id="barChart" width="900" height="360"></canvas></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Functional Status Pie</h3><canvas id="pieChart" width="700" height="360"></canvas></div>
    <div class="card"><h3>Baseline vs Latest</h3><div id="baselineLatest"></div></div>
  </div>
</template>

<template id="vaccinationTpl">
  <div class="grid2">
    <div class="card">
      <h3>Vaccination Record</h3>
      <div class="formgrid">
        <label>Child<select id="vaxChild"></select></label>
        <label>Vaccine / Dose<input id="vaxName" placeholder="e.g. DPT Booster"></label>
        <label>Date<input id="vaxDate" type="date"></label>
        <label>Status<select id="vaxStatus"><option>Given</option><option>Due</option><option>Planned</option><option>Not known</option></select></label>
        <label>Notes<input id="vaxNote"></label>
      </div>
      <button id="saveVax">Save Vaccination Entry</button>
    </div>
    <div class="card">
      <div class="cardhead"><h3>Schedule / Upcoming Sessions</h3><select id="vaxFilter"></select></div>
      <div id="vaxList"></div>
    </div>
  </div>
</template>

<template id="documentsTpl">
  <div class="grid2">
    <div class="card">
      <h3>Documents, Camera & Manual Card</h3>
      <p class="muted">Capture directly from camera or choose from gallery/files. Useful during busy clinic hours.</p>
      <div class="formgrid">
        <label>Child<select id="docChild"></select></label>
        <label>Document Type<select id="docType">
          <option>Manual Swarnaprashan Card</option>
          <option>Investigation Report</option>
          <option>Clinical Photo</option>
          <option>Previous Prescription</option>
          <option>Growth Record</option>
          <option>Vaccination Record</option>
          <option>Consent / Other</option>
        </select></label>
        <label>Date<input id="docDate" type="date"></label>
        <label>Notes<input id="docNote" placeholder="Optional note"></label>
      </div>
      <div class="upload-grid">
        <label class="uploadbox">📷 Open Camera
          <input id="cameraInput" type="file" accept="image/*" capture="environment">
        </label>
        <label class="uploadbox">🖼 Gallery / 📎 File / PDF
          <input id="fileInput" type="file" multiple accept="image/*,.pdf,.doc,.docx">
        </label>
      </div>
      <div id="selectedFiles" class="selected-files"></div>
      <button id="saveDocs">Save Selected Files</button>
      <p class="tiny muted">Files are stored locally in this browser using IndexedDB.</p>
    </div>
    <div class="card">
      <div class="cardhead"><h3>Saved Documents</h3><select id="docFilterChild"></select></div>
      <div id="docList"></div>
    </div>
  </div>
</template>

<template id="reportsTpl">
  <div class="card">
    <div class="cardhead"><div><h3>Digital Swarnaprashan Prescription & Parent Progress Report</h3><p class="muted">Print, Save as PDF, Share or WhatsApp.</p></div><span class="pill">Print-ready</span></div>
    <div class="formgrid">
      <label>Child<select id="reportChild"></select></label>
      <label>Report Type<select id="reportType"><option>Latest Visit + Longitudinal Progress</option><option>Prescription Only</option><option>Complete Clinical Summary</option></select></label>
      <label><input type="checkbox" id="incGraphs" checked> Include graph summary</label>
      <label><input type="checkbox" id="incDocs" checked> Include document list</label>
    </div>
    <div class="actionrow">
      <button id="generateReport">Generate Report</button>
      <button class="ghost" id="printReport">Print / Save PDF</button>
      <button class="ghost" id="shareReport">Share</button>
      <button class="ghost" id="waReport">WhatsApp</button>
    </div>
  </div>
  <div id="reportPaper" class="reportpaper"></div>
</template>

<template id="educationTpl">
  <div class="card">
    <div class="cardhead"><div><h3>Diet • Pathya • Apathya • Lifestyle</h3><p class="muted">Parent guidance can be printed with the prescription.</p></div><span class="pill">Parent Education</span></div>
    <div class="formgrid">
      <label>Child<select id="eduChild"></select></label>
      <label>Focus<select id="eduFocus">
        <option>General Swarnaprashan Support</option><option>Low Appetite</option><option>Constipation</option><option>Poor Sleep</option>
        <option>Frequent Illness</option><option>Learning / Memory Support</option><option>Underweight / Poor Growth</option>
      </select></label>
    </div>
    <button id="buildPlan">Generate Parent Plan</button>
  </div>
  <div id="planPaper" class="reportpaper"></div>
</template>

<template id="backupTpl">
  <div class="card">
    <h3>Backup, Restore & Export</h3>
    <p>Download structured child, clinical and follow-up data. Uploaded files remain in browser storage and can be opened/downloaded individually.</p>
    <div class="actionrow">
      <button id="backupBtn">Download JSON Backup</button>
      <label class="buttonlike">Restore JSON<input type="file" id="restoreInput" accept=".json" hidden></label>
      <button class="ghost" id="csvBtn">Export Follow-up CSV</button>
    </div>
  </div>
</template>

<template id="settingsTpl">
  <div class="card"><h3>Clinic & Prescription Settings</h3><div id="settingsForm"></div></div>
</template>

<script src="app.js"></script>
</body>
</html>
