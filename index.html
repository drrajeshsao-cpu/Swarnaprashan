<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#173d33"/>
<title>Swarnaprashan Pro • Mahamaya Clinic</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">स्व</div>
      <div><h1>Swarnaprashan Pro</h1><p>Mahamaya Clinic</p></div>
    </div>
    <div class="clinic-chip">Ancient Wisdom • Modern Diagnosis • Holistic Healing</div>
    <nav id="nav"></nav>
    <div class="sidebar-footer"><button class="ghost full" data-action="exportBackup">⬇ Backup JSON</button><button class="ghost full" data-action="importBackup">⬆ Restore</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menu">☰</button>
      <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search child by name, mobile or ID…"/><button id="searchBtn">Search</button></div>
      <div class="top-actions"><button class="icon-btn" data-action="printCurrent" title="Print">🖨</button><button class="icon-btn" data-action="shareCurrent" title="Share">↗</button><div class="avatar">DR</div></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<input type="file" id="restoreInput" accept="application/json" hidden/>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
