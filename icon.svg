<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efd49c"/>
      <stop offset="1" stop-color="#5f4327"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#g)"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="16"/>
  <text x="256" y="308" text-anchor="middle" font-size="160" font-family="Segoe UI Symbol, Noto Color Emoji, Apple Color Emoji, sans-serif" fill="#fff4d6" filter="url(#glow)">✨</text>
</svg>